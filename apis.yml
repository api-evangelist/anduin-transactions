aid: anduin-transactions
name: Anduin Transactions
description: >-
  Anduin builds digital fund operations software for private markets, serving
  venture capital, private equity, and hedge funds. Its platform streamlines
  investor onboarding and fund administration through products including Fund
  Subscription, Data Room, Investor Data Management, Engagement Hub, Integration
  Hub, a Data Extraction Service, and Investor Access/Portal. Anduin reports
  1,305+ funds served, $244B+ capital raised, and 74,000+ investors subscribed.
  The company was surfaced as a portfolio company of 500 Global. As of this
  profile Anduin publishes no public developer API or OpenAPI; this record
  captures the company's public identity, security posture, and compliance
  program for the API Evangelist network.
